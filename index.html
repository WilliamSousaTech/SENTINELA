<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinela OS | Histórico e Relatório</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <!-- Biblioteca Chart.js para o Gráfico de Linha de Tendência Temporal -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="glow-bg"></div>
    <div class="container">
        <header>
            <h1><span class="neon-text">SENTINELA</span> OS</h1>
            <p class="subtitle">Protótipo IoT de Monitoramento Ambiental e Histórico</p>
            
            <div class="led-panel">
                <span>Estado Atual:</span>
                <div class="led-badge" id="badge-normal">NORMAL</div>
                <div class="led-badge" id="badge-atencao">ATENÇÃO</div>
                <div class="led-badge" id="badge-alerta">ALERTA</div>
            </div>
        </header>

        <main class="dashboard">
            <!-- Temperatura -->
            <div class="card">
                <div class="card-icon">🌡️</div>
                <h3>Temperatura</h3>
                <div class="valor" id="temp">-- <span class="unit">°C</span></div>
                <div class="status-bar"><div class="fill temp-fill"></div></div>
            </div>

            <!-- Umidade -->
            <div class="card">
                <div class="card-icon">💧</div>
                <h3>Umidade</h3>
                <div class="valor" id="umid">-- <span class="unit">%</span></div>
                <div class="status-bar"><div class="fill umid-fill"></div></div>
            </div>

            <!-- Presença -->
            <div class="card alert-card" id="pres-card">
                <div class="card-icon">👁️</div>
                <h3>Sensor PIR</h3>
                <div class="valor" id="pres">Scanning...</div>
                <div class="radar"></div>
            </div>

            <!-- CARD DO GRÁFICO DE TENDÊNCIA TEMPORAL -->
            <div class="card chart-card">
                <h3>📊 Gráfico de Tendência Temporal (Banco de Dados)</h3>
                <div class="chart-container">
                    <canvas id="graficoHistorico"></canvas>
                </div>
            </div>
        </main>
        
        <footer>
            <p>Status do Banco: <span class="online-indicator blinking"></span> <span id="footer-status">Gravando histórico e plotando gráfico ao vivo</span></p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
